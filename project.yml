name: MultiPathStoryTool
options:
  bundleIdPrefix: com.multipathstorytool
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MultiPathStoryTool:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MultiPathStoryTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multipathstorytool.app
        PRODUCT_NAME: MultiPathStoryTool
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: MultiPathStoryTool/MultiPathStoryTool.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MultiPathStoryTool
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Multi-Path Story
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.multipathstorytool.story
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.multipathstorytool.story
            UTTypeDescription: Multi-Path Story Document
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - mpstory
    entitlements:
      path: MultiPathStoryTool/MultiPathStoryTool.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  MultiPathStoryToolTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MultiPathStoryToolTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multipathstorytool.tests
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: MultiPathStoryTool

schemes:
  MultiPathStoryTool:
    build:
      targets:
        MultiPathStoryTool: all
        MultiPathStoryToolTests: [test]
    test:
      targets:
        - MultiPathStoryToolTests
    run:
      config: Debug
